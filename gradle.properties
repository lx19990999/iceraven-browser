# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Temporary workaround: all projects must use identical JVM arguments in gradle.properties to enable daemon sharing.
# Do not modify these values without first reviewing Bug 1954747: https://bugzilla.mozilla.org/show_bug.cgi?id=1954747
# org.gradle.jvmargs=-Xmx7g -Xms2g -XX:MaxMetaspaceSize=6g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
org.gradle.jvmargs=-Xmx20g -Xms4g -XX:MaxMetaspaceSize=6g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:G1HeapRegionSize=16m -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=65530 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=65530 -Dhttp.nonProxyHosts="*.nonproxyrepos.com|localhost" -Dhttps.nonProxyHosts="*.nonproxyrepos.com|localhost"
org.gradle.parallel=true
org.gradle.workers.max=12
org.gradle.configureondemand=true

org.gradle.configuration-cache=false

#org.gradle.configuration-cache.problems=warn

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
#org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.useAndroidX=true
android.enableJetifier=false

# Enables copying of Jetpack Benchmark results from the device to the build directory.
android.enableAdditionalTestOutput=true

libLicense=MPL-2.0
libLicenseUrl=https://www.mozilla.org/en-US/MPL/2.0/
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=false

# Test fixtures
android.experimental.enableTestFixturesKotlinSupport=true

# HTTP代理
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65530
systemProp.http.nonProxyHosts=*.nonproxyrepos.com|localhost
# HTTPS代理
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65530
systemProp.https.nonProxyHosts=*.nonproxyrepos.com|localhost

# 额外的代理配置，确保所有网络请求都走代理